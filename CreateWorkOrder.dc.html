<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สร้างใบงาน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#0F6B5C}a:hover{color:#0A4F44}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #111827; background: #F5F6F8; min-height: 100vh; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 260px; background: #FFFFFF">
  <dc-import name="Sidebar" active="wo" hint-size="260px,900px"></dc-import>
</div>
<main style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: clamp(20px, 4vw, 28px) clamp(16px, 3vw, 32px) 48px">

    <dc-import name="PageHeader" icon="workorder" back-label="{{backLabel}}" back-href="{{backHref}}" title="สร้างใบงาน" subtitle="{{subtitle}}" hint-size="100%,96px"></dc-import>

    <sc-if value="{{noSites}}" hint-placeholder-val="{{ false }}">

        <sc-if value="{{canAddSite}}" hint-placeholder-val="{{ true }}">
          <dc-import name="Button" icon="plus" label="เพิ่มไซต์ก่อน" href="SiteForm.dc.html" save-keys="sc.editSite=|sc.siteFormFrom=CreateWorkOrder" hint-size="130px,44px"></dc-import>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{hasSites}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <section style="flex: 1 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="wo-site" style="font-size: 13px; font-weight: 600">ไซต์</label>
            <sc-if value="{{siteFixed}}" hint-placeholder-val="{{ true }}">
              <div id="wo-site" style="min-height: 44px; padding: 0 12px; border: 1px solid #E3E6EB; border-radius: 8px; font-size: 14px; background: #F5F6F8; display: flex; align-items: center; font-weight: 600">{{siteShown}}</div>
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: #4B5563">{{siteFixedNote}}<button type="button" onClick="{{unfixSite}}" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #0F6B5C; font-size: 13px; font-weight: 600">เปลี่ยนไซต์</button></span>
            </sc-if>
            <sc-if value="{{sitePick}}" hint-placeholder-val="{{ false }}">
              <select id="wo-site" value="{{site}}" onChange="{{setSite}}" style="min-height: 44px; padding: 0 10px; border: 1px solid #858D9B; border-radius: 8px; font-size: 14px; background: #FFFFFF">
                <sc-for list="{{sites}}" as="o" hint-placeholder-count="4"><option value="{{o.v}}">{{o.t}}</option></sc-for>
              </select>
              <span style="font-size: 12px; color: #4B5563">แสดงเฉพาะไซต์ที่คุณมีสิทธิ์สร้างใบงาน</span>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="wo-due" style="font-size: 13px; font-weight: 600">กำหนดเสร็จ</label>
            <input id="wo-due" type="date" min="2026-11-15" value="{{due}}" onChange="{{setDue}}" aria-invalid="{{dueBad}}" aria-describedby="wo-due-msg" style="{{dueStyle}}">
            <span id="wo-due-msg" style="{{dueMsgStyle}}">{{dueMsg}}</span>
          </div>
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
          <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">ประเภทงาน</legend>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px">
            <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
              <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
                <span style="font-weight: 700; font-size: 15px">{{t.label}}</span>
                <span style="font-size: 12px; color: #4B5563">{{t.desc}}</span>
              </button>
            </sc-for>
          </div>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0">
          <legend style="font-size: 13px; font-weight: 600; margin-bottom: 8px">โซน / พื้นที่ <span style="font-weight: 400; color: #4B5563">(เลือกอย่างน้อย 1)</span></legend>
          <div style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{zones}}" as="z" hint-placeholder-count="4">
              <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #D5D9E0; border-radius: 8px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{z.on}}" onChange="{{z.toggle}}" style="width: 18px; height: 18px; accent-color: #0F6B5C">{{z.label}}</label>
            </sc-for>
          </div>
          <sc-if value="{{showZoneErr}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 6px; font-size: 12px; color: #B42318">เลือกโซนอย่างน้อย 1 โซน</div></sc-if>
        </fieldset>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
          <legend style="font-size: 13px; font-weight: 600; margin-bottom: 4px">ผู้รับผิดชอบ <span style="font-weight: 400; color: #4B5563">· เฉพาะคนที่มีสิทธิ์ในไซต์นี้</span></legend>
          <div style="border: 1px solid #D5D9E0; border-radius: 10px; overflow: hidden">
            <sc-for list="{{techs}}" as="p" hint-placeholder-count="4">
          <button onClick="{{p.pick}}" disabled="{{p.off}}" aria-pressed="{{p.on}}" style="{{p.style}}">
            <sc-if value="{{p.av}}" hint-placeholder-val="{{ true }}"><dc-import name="Avatar" person="{{p.av}}" size="40" hint-size="40px,40px"></dc-import></sc-if>
            <sc-if value="{{p.noAv}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: #F3F4F6; color: #374151; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none">{{p.ini}}</span></sc-if>
            <span style="flex: 1; min-width: 0; text-align: left">
              <span style="display: block; font-size: 14px; font-weight: 600">{{p.name}}</span>
              <span style="display: block; font-size: 12px; color: #4B5563">{{p.note}}</span>
            </span>
            <sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
              <dc-import name="Icon" icon="check" size="20" tone="brand" hint-size="20px,20px"></dc-import>
            </sc-if>
          </button>
        </sc-for>
          </div>
          <sc-if value="{{showTechErr}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; color: #B42318">เลือกผู้รับผิดชอบ 1 คน</div></sc-if>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="wo-note" style="font-size: 13px; font-weight: 600">หมายเหตุถึงช่าง</label>
          <textarea id="wo-note" rows="3" placeholder="เช่น โซน D ฝุ่นหนา ใช้น้ำ DI เท่านั้น" style="padding: 10px 12px; border: 1px solid #858D9B; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical"></textarea>
        </div>

        <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; border-top: 1px solid #E3E6EB; padding-top: 16px">
          <sc-if value="{{showMissing}}" hint-placeholder-val="{{ false }}"><span role="status" style="margin-right: auto; font-size: 13px; color: #B42318">{{missing}}</span></sc-if>
          <dc-import name="Button" label="ยกเลิก" href="{{backHref}}" variant="secondary" hint-size="90px,44px"></dc-import>
          <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><dc-import name="Button" icon="checkCircle" label="สร้างและแจ้งช่าง" href="{{createHref}}" save-keys="{{createStore}}" hint-size="160px,44px"></dc-import></sc-if><sc-if value="{{blocked}}" hint-placeholder-val="{{ false }}"><dc-import name="Button" icon="checkCircle" label="สร้างและแจ้งช่าง" on-press="{{tryCreate}}" hint-size="160px,44px"></dc-import></sc-if>
        </div>
      </section>

    </div>
    </sc-if>
  </div>
</main>
</div>
</x-dc>

      siteFixedNote: 'เลือกไว้จากหน้า ' + ORIGIN[from].label,
      unfixSite: function () { self.setState({ unfix: true, site: site }); },
      sites: siteNames.map(function (n) { return { v: n, t: DN(n) }; }),
      setSite: function (e) { self.setState({ site: e.target.value }); },
      createHref: blocked ? '' : (['Schedule', 'Main', 'SiteDetail', 'DeviceDetail', 'OrgEmpty', 'Analytics'].indexOf(from) >= 0 ? ORIGIN[from].href : 'WorkOrders.dc.html'), /* return where the user started; the flash lands there */ blocked: blocked, ready: !blocked, missing: 'ยังสร้างไม่ได้: ' + miss.join(' · '),
      showMissing: blocked && st.tried, showZoneErr: zoneBad && st.tried, showTechErr: techBad && st.tried,
      tryCreate: function () { self.setState({ tried: true }); },
      createStore: blocked || !newNo ? '' : 'sc.flash=สร้างใบงาน ' + newNo + ' แล้ว · แจ้ง' + techName + ' แล้ว|sc.newno=' + newNo + '|sc.newtype=' + typeRow[1] + '|sc.newdue=' + dueTh + '|sc.createdWo=' + JSON.stringify(nextCreated),
      due: due, dueBad: (dueBad && (st.tried || st.dueTouched)) ? 'true' : 'false',
      dueStyle: 'min-height: 44px; padding: 0 12px; border: 1px solid ' + (dueBad && (st.tried || st.dueTouched) ? '#B42318' : '#858D9B') + '; border-radius: 8px; font-size: 14px',
      dueMsg: dueBad && (st.tried || st.dueTouched) ? 'กำหนดเสร็จต้องเป็นวันนี้ (15 พ.ย. 2569) หรือหลังจากนี้' : '',
      dueMsgStyle: 'font-size: 12px; color: #B42318' + (dueBad && (st.tried || st.dueTouched) ? '' : '; display: none'),
      setDue: function (e) { self.setState({ due: e.target.value, dueTouched: true }); },
      zoneBad: zoneBad, techBad: techBad,
      zones: zoneList.map(function (z) { var k = site + '|' + z, on = zoneOn(z); return { label: z.length === 1 ? 'โซน ' + z : z, on: on,
        toggle: function () { var o = Object.assign({}, self.state.zones); o[k] = !on; self.setState({ zones: o }); } }; }),
      types: types.map(function (t) { var on = t[0] === typeId; return { label: t[1], desc: t[2], on: on, pick: function () { self.setState({ type: t[0], typeTouched: true }); },
        style: 'min-height:72px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:10px;text-align:left;color:#111827;border:' + (on ? '2px solid #0F6B5C;background:#F0F7F5' : '1px solid #D5D9E0;background:#FFFFFF') }; }),
      techs: techs.map(function (p) { var on = !!tech && p.id === tech.id; return Object.assign({ off: false, ini: '' }, p, { on: on, noAv: !p.av, pick: function () { if (!p.off) self.setState({ tech: p.id }); },
        style: 'width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:8px 14px;border:0;border-top:1px solid #EEF0F3;color:#111827;background:' + (on ? '#F0F7F5' : '#FFFFFF') + (p.off ? ';opacity:0.55;cursor:not-allowed' : '') }); })
    };
  }
}
</script>
