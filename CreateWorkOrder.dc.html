<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สร้างใบงาน</title>
<script src="./support.js"></script>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#0F6B5C}a:hover{color:#0A4F44}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>

</div>

          </div>

  </div>
</main>
</div>
