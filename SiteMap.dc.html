<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แผนที่ไซต์</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; gap: 8px; width: 100%">
  <div role="group" aria-label="{{groupLabel}}" style="{{boxStyle}}">
    <div id="{{mapId}}" style="position: absolute; inset: 0; z-index: 0; background: #F5F6F8"></div>

    <sc-if value="{{showStatus}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="position: absolute; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; font-size: 13px; color: #4B5563; background: #F5F6F8">{{statusText}}</div>
    </sc-if>

    <sc-if value="{{hasZoom}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{toggleWhole}}" style="position: absolute; right: 10px; top: 10px; z-index: 1000; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #D5D9E0; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #374151; cursor: pointer; box-shadow: 0 1px 2px rgba(17,24,39,0.12)">{{zoomLabel}}</button>
    </sc-if>

    <sc-if value="{{hasCheckin}}" hint-placeholder-val="{{ false }}">
      <span style="{{distStyle}}">{{distText}}</span>
    </sc-if>

    <sc-if value="{{hasCard}}" hint-placeholder-val="{{ false }}">
      <div role="group" aria-label="{{card.name}}" style="position: absolute; left: 10px; right: 10px; bottom: 24px; z-index: 1000; max-width: 300px; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; box-shadow: 0 8px 24px rgba(17,24,39,0.16); padding: 12px 8px 12px 14px; display: flex; gap: 8px; align-items: flex-start; box-sizing: border-box">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
          <div style="font-weight: 700; font-size: 15px">{{card.name}}</div>
          <div style="font-size: 12px; color: #4B5563">{{card.prov}}</div>
          <dc-import name="StatusPill" kind="site" value="{{card.st}}" hint-size="90px,24px"></dc-import>
          <a href="SiteDetail.dc.html" onPointerDown="{{openSite}}" onKeyDown="{{openSite}}" onClick="{{openSite}}" style="display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; font-weight: 600; color: #0F6B5C; text-decoration: none">ดูไซต์ →</a>
        </div>
        <button type="button" onClick="{{closeCard}}" aria-label="ปิด" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; font-size: 20px; color: #4B5563; cursor: pointer; border-radius: 8px">×</button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{hasUnpinned}}" hint-placeholder-val="{{ false }}">
    <div role="note" style="font-size: 13px; color: #374151; padding: 8px 12px; border-radius: 8px; background: #FFF4E5; border: 1px solid #F3D7B0">{{unpinnedText}}<sc-if value="{{canEditSites}}" hint-placeholder-val="{{ true }}"> <a href="SiteForm.dc.html" onPointerDown="{{editUnpinned}}" onKeyDown="{{editUnpinned}}" onClick="{{editUnpinned}}" style="color: #0F6B5C; font-weight: 600">ปักหมุดที่หน้าแก้ไขไซต์ →</a></sc-if></div>
  </sc-if>
  <sc-if value="{{showLegend}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #374151; align-items: center">
      <sc-for list="{{legend}}" as="g" hint-placeholder-count="3">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="{{g.style}}">{{g.glyph}}</span>{{g.t}}</span>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{showPickText}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="{{pickTextStyle}}">{{pickText}}</div>
  </sc-if>
</div>
</x-dc>

      if (pts.length === 1) { map.setView(pts[0], 12); return; }
      map.fitBounds(pts, { padding: [48, 48], maxZoom: 12 });
    } else if (mode === 'pick') {
      var pin = this.pinNow();
      // geodata has no street detail past ~12, so keep the pin view where roads and province names still show
      if (pin) map.setView([pin.lat, pin.lon], Math.min(Math.max(map.getZoom() || 0, 10), this.base === 'tiles' ? 16 : 12)); else map.fitBounds(SM_TH, { padding: [16, 16] });
    } else {
      var s = this.site(), c = this.checkin();
      map.fitBounds(L.latLng(s.lat, s.lon).toBounds(SM_RADIUS * 2.4).extend([c.lat, c.lon]), { padding: [24, 24] });
    }
  }
  onMapClick(e) {
    if (this.opt('mode', 'sites') !== 'pick') { if (this.openId()) { this._open = ''; this.setState({ open: '' }); this.draw(); } return; }
    var lat = e.latlng.lat, lon = e.latlng.lng;
    if (!smInThailand(lat, lon)) { this.setState({ outside: true }); return; }
    this.setState({ outside: false });
    this._pin = { lat: Number(lat.toFixed(4)), lon: Number(lon.toFixed(4)) };
    this.draw();
    if (this.props.onPick) this.props.onPick(this._pin);
  }
  renderVals() {
    smRegExtra(this.opt('extra', ''));
    var self = this, mode = this.opt('mode', 'sites');
    var key = ['mode', 'sites', 'selected', 'pinLat', 'pinLon', 'checkinLat', 'checkinLon'].map(function (k) { return String(self.props[k]); }).join('|');
    if (key !== this._key) {
      var first = this._key == null; this._key = key;
      if (!first && this.pin()) this._pin = null; // typed coordinates replace the clicked pin
      if (!first && this.map) setTimeout(function () { if (self.map) { self.draw(); self.fit(); } }, 0);
    }
    var H = Number(this.opt('height', 480));
    var dist = mode === 'checkin' ? smDist(this.site(), this.checkin()) : 0, near = dist <= SM_RADIUS;
    var card = mode === 'sites' ? SM_SITES[this.openId()] : null;
    var pin = this.pinNow();
    var dotBase = 'width: 14px; height: 14px; border-radius: 999px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #FFFFFF; ';
    var legend = mode === 'checkin'
      ? [{ t: 'ไซต์ (วงประ = ระยะ ' + SM_RADIUS + ' ม.)', glyph: '', style: dotBase + 'background: #0F6B5C; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #0F6B5C' },
         { t: 'จุดเช็กอินของช่าง', glyph: '', style: dotBase + 'background: #1D4ED8; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px #1D4ED8' }]
      : ['ok', 'due', 'late'].map(function (k) { var s = SM_ST[k]; return { t: s.t, glyph: s.glyph, style: dotBase + (k === 'due' ? 'background: #FFFFFF; border: 3px solid ' + s.c : 'background: ' + s.c) }; });
    return {
      mapId: this.mapId,
      groupLabel: mode === 'pick' ? 'แผนที่สำหรับปักหมุดตำแหน่งไซต์' : mode === 'checkin' ? 'แผนที่ตำแหน่งเช็กอิน' : 'แผนที่ไซต์',
      boxStyle: 'position: relative; width: 100%; height: ' + H + 'px; max-height: 75vh; min-height: 200px; overflow: hidden; border-radius: 12px; border: 1px solid #E3E6EB; background: #F5F6F8; box-sizing: border-box; isolation: isolate' + (mode === 'pick' ? '; cursor: crosshair' : ''),
      showStatus: !this.state.ready || this.state.failed,
      statusText: this.state.failed ? 'โหลดแผนที่ไม่ได้ ลองรีเฟรชหน้า ' + (this.state.err || '') : 'กำลังโหลดแผนที่…',
      hasZoom: mode !== 'checkin',
      zoomLabel: this.isWhole() ? (mode === 'pick' ? 'กลับไปที่หมุด' : 'ซูมเข้าไซต์') : 'ดูทั้งประเทศ',
      toggleWhole: function () { self._whole = !self.isWhole(); self.setState({ whole: self._whole }); self.fit(); },
      hasCheckin: mode === 'checkin',
      distText: 'ห่างจากไซต์ ' + dist.toLocaleString('en-US') + ' ม.' + (near ? '' : ' · เกินระยะ ' + SM_RADIUS + ' ม.'),
      distStyle: 'position: absolute; right: 10px; top: 10px; z-index: 1000; white-space: nowrap; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 2px rgba(17,24,39,0.12); ' + (near ? 'background: #E7F2EF; color: #0A4F44' : 'background: #FFF4E5; color: #8A3B06'),
      hasCard: !!card,
      card: card ? { name: smShown(card).name, prov: smShown(card).prov, st: this.stOf(this.openId()) } : { name: '', prov: '', st: 'ok' },
      openSite: function (e) { if (e && e.type === 'keydown' && e.key !== 'Enter') return; if (card) { try { window.sessionStorage.setItem('sc.siteName', card.name); window.sessionStorage.setItem('sc.siteFrom', 'Sites'); } catch (x) {} } },
      canEditSites: !!(this.props.canEdit ?? false),
      editUnpinned: function (e) { if (e && e.type === 'keydown' && e.key !== 'Enter') return; var u = self.unpinned(); if (u.length) { try { window.sessionStorage.setItem('sc.editSite', u[0]); } catch (x) {} } },
      hasUnpinned: mode === 'sites' && this.unpinned().length > 0, unpinnedText: this.unpinned().join(', ') + ' ยังไม่ปักหมุดตำแหน่ง จึงไม่แสดงบนแผนที่',
      closeCard: function () { self._open = ''; self.setState({ open: '' }); self.draw(); },
      showLegend: mode !== 'pick', legend: legend,
      showPickText: mode === 'pick',
      pickText: this.state.outside ? 'จุดที่แตะอยู่นอกประเทศไทย ลองแตะในเขตประเทศไทย' : pin ? 'ปักหมุดที่ ' + pin.lat.toFixed(4) + ', ' + pin.lon.toFixed(4) : 'แตะบนแผนที่เพื่อปักหมุดตำแหน่งไซต์ (ซูมเข้าได้ด้วยปุ่ม + −)',
      pickTextStyle: 'font-size: 13px; ' + (this.state.outside ? 'color: #B42318' : 'color: #374151')
    };
  }
}
</script>
