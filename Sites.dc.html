<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ไซต์ · SolarCare</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#0F6B5C}a:hover{color:#0A4F44}
button,input{font-family:inherit}
button{cursor:pointer}

</helmet>

              </a></sc-if>
            </li>
          </sc-for>
        </ul>
      </div>

            </div>

              </div>
              <span style="margin-left: 8px">{{s.peopleNote}}</span>
            </div>
          </div>
        </a>
        </sc-if>
      </sc-for>
    </div>
    </sc-if>
  </div>
</main>
  <dc-import name="Flash" page="Sites.dc.html" sample="" hint-size="100%,0px"></dc-import>
</div>
</x-dc>

    var f = self.state.f, q = self.state.q.trim().toLowerCase();
    var shown = all.filter(function (s) { return (f === 'all' || s.st === f) && (!q || (s.name + ' ' + s.prov).toLowerCase().indexOf(q) >= 0); });
    var propState = self.props.state || 'ready';
    if (self._lastPropState !== undefined && self._lastPropState !== propState && self.state.retried) { setTimeout(function () { self.setState({ retried: false }); }, 0); }
    self._lastPropState = propState;
    var listState = self.state.retried && self._retriedFor === propState ? 'ready' : propState;
    var busy = listState !== 'ready', orgEmpty = !busy && all.length === 0;
    var view = self.state.view, empty = !busy && !orgEmpty && shown.length === 0;
    var defs = [['all', 'ทั้งหมด'], ['ok', 'ปกติ'], ['due', 'ใกล้ครบรอบ'], ['late', 'เลยกำหนด'], ['unset', 'ยังไม่ตั้งรอบล้าง']];
    var byQ = all.filter(function (s) { return !q || (s.name + ' ' + s.prov).toLowerCase().indexOf(q) >= 0; });
    return (function (R) { R.phActions = R.canAdd ? [{ label: 'เพิ่มไซต์', icon: 'plus', href: 'SiteForm.dc.html', saveKeys: 'sc.editSite=|sc.siteFormFrom=Sites' }] : []; return R; })({
      f: f, setF: function (id) { self.setState({ f: id }); },
      chipOpts: defs.map(function (d) { return { id: d[0], label: d[1], count: byQ.filter(function (s) { return d[0] === 'all' || s.st === d[0]; }).length }; }),
      shownCount: shown.length, totalCount: all.length, filtered: f !== 'all' || !!q,
      sites: shown,
      mapStatuses: shown.map(function (s) { return s.id + ':' + s.st; }).join(','),
      mapExtra: shown.filter(function (s) { return s.created; }).map(function (s) { return [s.id, s.name, s.prov, s.lat || '', s.lon || '', s.st].join('|'); }).join(';'),
      siteIds: shown.map(function (s) { return s.id; }).join(',') || 'none', // never '' (SiteMap would show every pin)
      subtitle: org.admin ? 'แสดงทุกไซต์ในองค์กร · บทบาทของคุณ: ' + org.role : 'แสดงเฉพาะไซต์ที่คุณได้รับสิทธิ์ · บทบาทของคุณ: ' + org.role,
      canAdd: org.admin, listBusy: busy, listState: busy ? listState : 'loading', orgEmpty: orgEmpty,
      retry: function () { self._retriedFor = propState; self.setState({ retried: true }); },
      q: self.state.q, setQ: function (e) { self.setState({ q: e.target.value }); },
      empty: empty, emptyText: q ? 'ไม่พบไซต์ที่ตรงกับ “' + self.state.q.trim() + '”' : 'ไม่มีไซต์ในสถานะนี้',
      clearAll: function () { self.setState({ q: '', f: 'all' }); },
      showMap: !busy && !orgEmpty && !empty && view === 'map', showGrid: !busy && !orgEmpty && !empty && view === 'list',
      views: [['list', 'รายการ'], ['map', 'แผนที่']].map(function (d) { var on = d[0] === view; return { label: d[1], on: on, pick: function () { self.setState({ view: d[0] }); },
        style: 'min-height:44px;padding:0 16px;border:0;font-size:13px;font-weight:600;background:' + (on ? '#0F6B5C;color:#FFFFFF' : '#FFFFFF;color:#374151') }; })
    });
  }
}
</script>
