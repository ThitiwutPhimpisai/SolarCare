<sc-if value="{{single}}" hint-placeholder-val="{{ true }}">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F6B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.d}}"></path></svg>
        <code style="font-size: 12px; color: #4B5563">{{g.n}}</code>
      </div>
    </sc-for>
  </div>
</sc-if>
