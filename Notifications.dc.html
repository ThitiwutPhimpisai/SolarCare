<html lang="th">
<head>
<meta charset="utf-8">
<title>การแจ้งเตือน · SolarCare</title>
<script src="./support.js"></script>
</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#0F6B5C}a:hover{color:#0A4F44}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>

</div>

                </a>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">

              </tr>
            </sc-for>
          </tbody>
        </table>
        <p style="margin: 0; font-size: 12px; color: #4B5563">การเข้าถึงข้ามองค์กรโดยทีม Qleen จะแจ้ง เจ้าขององค์กร ทางอีเมลเสมอ ปิดไม่ได้</p>
      </aside>
    </div>
  </div>
</main>
  <dc-import name="Flash" page="Notifications.dc.html" sample="" hint-size="100%,0px"></dc-import>
</div>
</x-dc>

      emptyTitle: s.tab === 'unread' ? 'อ่านครบทุกรายการแล้ว' : s.tab === 'action' ? 'ไม่มีเรื่องที่ต้องดำเนินการ' : 'ยังไม่มีการแจ้งเตือน',
      emptyText: s.tab === 'all' ? 'เมื่อมีใบงานรออนุมัติ ไซต์เลยกำหนดล้าง หรือคำเชิญใหม่ จะแสดงที่นี่' : 'กด "ทั้งหมด" เพื่อดูการแจ้งเตือนทุกรายการ',
      markAll: function () { try { window.sessionStorage.setItem('sc.read', 'all'); } catch (x) {} self.setState({ sync: Date.now(), liveMsg: 'ทำเครื่องหมายว่าอ่านแล้วทั้งหมด' }); },
      tab: s.tab, setTab: function (id) { self.setState({ tab: id }); }, clearTab: function () { self.setState({ tab: 'all' }); },
      tabOpts: [['all', 'ทั้งหมด'], ['unread', 'ยังไม่อ่าน'], ['action', 'ต้องดำเนินการ']].map(function (t) { return { id: t[0], label: t[1], count: all.filter(function (n) { return t[0] === 'all' || (t[0] === 'unread' && isUnread(n)) || (t[0] === 'action' && n.action); }).length }; }),
      shownCount: filtered.length, totalCount: all.length, filtered: s.tab !== 'all',
      prefs: events.map(function (ev) { return { label: ev[1], cells: channels.map(function (ch, i) { var forced = ev[0] === 'cross' && i === 0; return { on: forced || !!s.prefs[ev[0]][i], forced: forced, notForced: !forced, aria: ev[1] + ' ทาง' + ch + (forced ? ' (บังคับ ปิดไม่ได้)' : ''),
        toggle: function () { if (forced) return; var p = Object.assign({}, s.prefs); var row = p[ev[0]].slice(); row[i] = row[i] ? 0 : 1; p[ev[0]] = row; self.setState({ prefs: p }); } }; }) }; })
    });
  }
}
</script>
