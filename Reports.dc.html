<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>รายงาน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@media (max-width: 767px){
.rt{min-width:0 !important}.rt thead{display:none !important}.rt tr{display:block !important;padding:10px 4px !important}.rt td{display:flex !important;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:4px 12px !important;border:0 !important;text-align:right}.rt td[data-label]::before{content:attr(data-label);font-size:12px;color:#4B5563;text-align:left}.rt td.rt-main{display:block !important;text-align:left;padding-bottom:6px !important}
}
body{margin:0;background:#F5F6F8}
a{color:#0F6B5C}a:hover{color:#0A4F44}
button{font-family:inherit;cursor:pointer}
.rp-types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.rp-sel{display:none}
@media (max-width: 767px){.rp-types{display:none !important}.rp-sel{display:block !important}}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; color: #111827; background: #F5F6F8; min-height: 100vh; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 260px; background: #FFFFFF">
  <dc-import name="Sidebar" active="reports" hint-size="260px,900px"></dc-import>
</div>
<main style="flex: 999 1 520px; min-width: 0; box-sizing: border-box; padding: clamp(20px, 4vw, 28px) clamp(16px, 3vw, 32px) 48px">
  <div style="max-width: 1376px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
    <dc-import name="PageHeader" icon="report" title="รายงาน" subtitle="{{scopeText}}" actions="{{headActs}}" hint-size="100%,96px"></dc-import>

    <section aria-labelledby="rp-type-h" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="rp-type-h" style="margin: 0; font-size: 14px; color: #374151">ประเภทรายงาน</h2>
      <select class="rp-sel" id="rp-type-sel" aria-labelledby="rp-type-h" value="{{type}}" onChange="{{pickSel}}" style="width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #D5D9E0; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #111827">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="6"><option value="{{t.id}}">{{t.title}}</option></sc-for>
      </select>
      <div class="rp-types" role="group" aria-labelledby="rp-type-h">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
            <dc-import name="Icon" icon="{{t.icon}}" size="18" bg="{{t.iconBg}}" hint-size="32px,32px"></dc-import>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left"><span style="font-size: 14px; font-weight: 700; color: #111827">{{t.title}}</span><span style="font-size: 12px; color: #4B5563; line-height: 1.4">{{t.desc}}</span></span>
          </button>
        </sc-for>
      </div>
    </section>

    <dc-import name="DateRange" label="ช่วงเวลาของรายงาน" on-change="{{onRange}}" hint-size="100%,170px"></dc-import>

    <div style="min-width: 0">
      <dc-import name="FilterChips" label="ไซต์ในรายงาน" value="{{siteF}}" options="{{siteOpts}}" on-change="{{setSiteF}}" hint-size="100%,44px"></dc-import>
    </div>

    <sc-if value="{{showState}}" hint-placeholder-val="{{ false }}">
      <section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px">
        <dc-import name="ListState" state="{{listState}}" unit="รายงาน" icon="report" empty-title="ยังไม่มีไซต์ในองค์กรนี้" empty-text="รายงานจะเริ่มแสดงเมื่อมีไซต์และข้อมูลจาก inverter" on-retry="{{retry}}" hint-size="100%,260px"></dc-import>
      </section>
    </sc-if>
    <sc-if value="{{showData}}" hint-placeholder-val="{{ true }}">
      <h2 style="margin: 4px 0 0; font-size: 18px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline">{{typeTitle}}<span style="font-size: 13px; font-weight: 400; color: #4B5563">{{rangeText}}</span></h2>
      <dc-import name="EnergyStats" view="report" report="{{type}}" org="{{org}}" site="{{siteF}}" from="{{rFrom}}" to="{{rTo}}" group="{{rGroup}}" compare="{{rCompare}}" range-label="{{rShort}}" hint-size="100%,1100px"></dc-import>
      <sc-if value="{{isEnergy}}" hint-placeholder-val="{{ false }}">
        <a href="EnergyValue.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">ดูความคุ้มค่าการล้างและสมมติฐานที่หน้าพลังงานและผลตอบแทน<dc-import name="Icon" icon="arrowRight" size="16" hint-size="16px,16px"></dc-import></a>
      </sc-if>
    </sc-if>
  </div>
</main>
  <dc-import name="Flash" page="Reports.dc.html" sample="" hint-size="100%,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["ready","loading","error"],"default":"ready"},"$preview":{"width":1440,"height":1400}}'>
// ---- sc.range resolver (DATA.md round 10) — identical copy in DateRange, EnergyStats, Reports, EnergyValue, WorkOrders ----
var SCR_START = Math.round(Date.UTC(2025, 0, 1) / 864e5), SCR_TODAY = Math.round(Date.UTC(2026, 10, 15) / 864e5);

var SCR_PRESETS = [['d7', '7 วัน'], ['d30', '30 วัน'], ['m3', '3 เดือน'], ['m6', '6 เดือน'], ['m12', '12 เดือน'], ['ytd', 'ปีนี้'], ['ly', 'ปีที่แล้ว'], ['custom', 'กำหนดเอง']];
function scrDay(iso) { var p = String(iso || '').split('-'); if (p.length < 3) return NaN; var d = Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); return isNaN(d) ? NaN : d; }
function scrIso(d) { var x = new Date(d * 864e5); return x.getUTCFullYear() + '-' + ('0' + (x.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + x.getUTCDate()).slice(-2); }

  if (p === 'ytd') return [Math.round(Date.UTC(2026, 0, 1) / 864e5), T]; if (p === 'ly') return [Math.round(Date.UTC(2025, 0, 1) / 864e5), Math.round(Date.UTC(2025, 11, 31) / 864e5)];
  return [ms(12), T];
}
function scrGroups(len) { return [['day', 'รายวัน', len <= 62, 'ช่วงยาวเกิน 62 วัน'], ['week', 'รายสัปดาห์', len >= 7 && len <= 366, len < 7 ? 'ช่วงสั้นกว่า 7 วัน' : 'ช่วงยาวเกิน 1 ปี'], ['month', 'รายเดือน', len >= 28, 'ช่วงสั้นกว่า 1 เดือน'], ['quarter', 'รายไตรมาส', len >= 89, 'ช่วงสั้นกว่า 3 เดือน'], ['year', 'รายปี', len >= 300, 'ช่วงสั้นกว่า 1 ปี']]; }

  var preset = SCR_PRESETS.some(function (x) { return x[0] === r.preset; }) ? r.preset : 'm12', a, b, clamped = false;
  if (preset === 'custom') { a = scrDay(r.from); b = scrDay(r.to); if (isNaN(a) || isNaN(b) || a > b) { preset = 'm12'; } }
  if (preset !== 'custom') { var pr = scrPresetRange(preset); a = pr[0]; b = pr[1]; }
  if (a < SCR_START) { a = SCR_START; clamped = true; } if (b > SCR_TODAY) { b = SCR_TODAY; clamped = true; } if (a > b) a = b;

    else if (g === 'month') { e = Math.round(Date.UTC(y, m + 1, 0) / 864e5); lab = SCR_MN[m] + ' ' + String(y + 543).slice(-2); if (x.getUTCDate() !== 1 || e > b) lab = x.getUTCDate() + '–' + new Date(Math.min(e, b) * 864e5).getUTCDate() + ' ' + lab; } // part of a month (e.g. 1–15 พ.ย. 69 month-to-date) says so

  ['carbon', 'คาร์บอนและสิ่งแวดล้อม', 'CO2 เครดิต ต้นไม้ ถ่านหิน', 'leaf'],
  ['tech', 'ประสิทธิภาพทีมช่าง', 'งานต่อช่าง ตรงเวลา ส่งกลับ', 'users'],
  ['device', 'อุปกรณ์และการแจ้งเตือน', 'ความพร้อมใช้ เหตุขัดข้อง MTTR', 'plug'],
  ['sla', 'SLA รายไซต์', 'ล้างตรงรอบ ล่าช้า ครบรอบถัดไป', 'calendar']
];
var RP_SITES = { a: [['ฟาร์มโคราช 1', 'k1'], ['ฟาร์มโคราช 2', 'k2'], ['หลังคาโรงงานบางปู', 'bp'], ['ลานจอดรถลพบุรี', 'lb']], b: [['สาขารังสิต', 'rs'], ['สาขาบางนา', 'bn']], c: [['โรงงาน A ลำพูน', 'lp']], d: [], e: [['หลังคาอาคาร A หัวหิน', 'e1']] };
class Component extends DCLogic {

  componentDidMount() {

    self._snap = snap();

    var sites = RP_SITES[org];
    var EDITS = (function () { try { return JSON.parse(SS('sc.siteEdits') || '{}') || {}; } catch (e) { return {}; } })();
    var DN = function (n) { return (EDITS[n] && EDITS[n].name) || n; };
    var stored = SS('sc.site'), one = sites.filter(function (r) { return r[0] === stored; })[0] || null;
    if (stored && stored !== 'all' && !one) { try { window.sessionStorage.setItem('sc.site', 'all'); } catch (e) {} } // site from another org
    var siteF = one ? one[1] : 'all';
    var type = SS('sc.reportType'); if (!RP_TYPES.some(function (t) { return t[0] === type; })) type = 'clean';
    var T = RP_TYPES.filter(function (t) { return t[0] === type; })[0];

    var propState = self.props.state ?? 'ready';
    if (self._lastPropState !== undefined && self._lastPropState !== propState && self.state.retried) { setTimeout(function () { self.setState({ retried: false }); }, 0); }

    var card = function (on) { return 'display: flex; align-items: flex-start; gap: 10px; min-height: 64px; padding: 12px 14px; border-radius: 12px; font-family: inherit; cursor: pointer; text-align: left; background: ' + (on ? '#F0F7F5; border: 2px solid #0F6B5C' : '#FFFFFF; border: 1px solid #E3E6EB'); };

      setSiteF: function (id) { var r = sites.filter(function (x) { return x[1] === id; })[0]; try { window.sessionStorage.setItem('sc.site', r ? r[0] : 'all'); } catch (e) {} self.setState({ sync: Date.now() }); },
      scopeText: (one ? DN(one[0]) : (org === 'c' ? 'ไซต์ที่คุณได้รับสิทธิ์ (ดูอย่างเดียว)' : 'ทุกไซต์')) + ' · ' + rr.label
    };
  }
}
</script>
</body>
</html>
