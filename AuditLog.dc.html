<head>

<x-dc>
<helmet>

</helmet>

      <div style="display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center">

      </div>

              <td data-label="ไซต์" class="al-nw" style="padding: 12px 20px; color: #374151">{{r.site}}</td>
